# pyproject.toml - WordBook 项目配置

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "WordBook"
version = "0.1.2"
description = "单词本工具"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.8"
authors = [{ name = "喵布" }]
keywords = ["wordbook", "vocabulary", "education", "pyside6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Education :: Language Learning",
]

dependencies = [
    "PySide6>=6.5.0",
    "loguru>=0.7.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0; platform_system != 'Emscripten'",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pipreqs>=0.4.0",
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
]
test = ["pytest>=7.0.0", "pytest-qt>=4.2.0", "pytest-cov>=4.0.0"]

[project.scripts]
wordbook = "main:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["graphics*", "utils*", "handle*"]
exclude = ["tests*", ".venv*", "__pycache__*", "*.egg-info"]

[tool.setuptools.package-data]
graphics = ["*.ui", "*.json"]
utils = ["*.json"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312", "py313", "py314"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["graphics", "utils", "handle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short --qt-api=pyside6"
